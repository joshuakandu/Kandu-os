<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>KANDU OS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 28px 20px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .subtitle {
      color: #8e8e93;
      margin-top: 4px;
      margin-bottom: 32px;
    }

    .card {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .status {
      color: #34c759;
      font-weight: 600;
    }

    .chat {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    input {
      flex: 1;
      background: #242424;
      border: 1px solid #363636;
      border-radius: 14px;
      padding: 15px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .task {
      padding: 12px 0;
      border-bottom: 1px solid #292929;
    }

    .task:last-child {
      border-bottom: 0;
    }

    .empty {
      color: #8e8e93;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      color: #8e8e93;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">KANDU</div>
    <div class="subtitle">Personal Operating System</div>

    <section class="card">
      <h2>KANDU Assistant</h2>
      <div class="status">● System Online</div>

      <div class="chat">
        <input
          type="text"
          placeholder="Tell KANDU what you need..."
        >
        <button>Send</button>
      </div>
    </section>

    <section class="card">
      <h2>Today</h2>
      <div class="empty">Nothing scheduled yet.</div>
    </section>

    <section class="card">
      <h2>Waiting On</h2>
      <div class="empty">Nothing waiting on you.</div>
    </section>

    <div class="nav">
      <span>Today</span>
      <span>Inbox</span>
      <span>This Week</span>
      <span>Waiting On</span>
    </div>

  </main>
<script>
  const input = document.querySelector("input");
  const button = document.querySelector("button");

  button.addEventListener("click", () => {
    const message = input.value.trim();

    if (!message) return;

    alert("KANDU heard: " + message);
    input.value = "";
  });

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      button.click();
    }
  });
</script>
</body>
</html>
